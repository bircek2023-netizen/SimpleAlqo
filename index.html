<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SimpleAlgo Trading Desk</title>
<style>
:root{--bg:#09070d;--pn:#120e1a;--pn2:#1d1628;--bd:#2c2140;--tx:#f3eefa;--mu:#9a8fae;--ac:#e040fb;--ac2:#a21caf;--g:#2ee59d;--r:#ff5c7a;--b:#38bdf8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f7f3fb;--pn:#fff;--pn2:#f1e9f8;--bd:#e0d3ec;--tx:#1b1224;--mu:#6b5f7d;--g:#0a9d65;--r:#d6264a;color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;overflow:hidden}
#sb{width:250px;background:var(--pn);border-right:1px solid var(--bd);padding:16px 12px;overflow:auto;flex:none}
.logo{display:flex;gap:10px;align-items:center;margin:0 4px 14px}.logo small{letter-spacing:.2em;color:var(--mu);font-size:10px;display:block}
.lg{width:34px;height:34px;border:2px solid var(--ac);border-radius:8px;display:grid;place-items:center;color:var(--ac);font-weight:800}
.gh{font-size:11px;letter-spacing:.15em;color:var(--mu);margin:16px 6px 6px;border-left:3px solid var(--ac);padding-left:8px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.nv:hover{background:var(--pn2)}.nv.on{background:linear-gradient(90deg,#e040fb33,#a21caf22);outline:1px solid #e040fb44}
.bd{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:6px;background:#e040fb33;color:var(--ac);font-weight:700}.bd.n{background:#38bdf833;color:var(--b)}
#wr{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--bd)}
#mn{flex:1;overflow:auto;padding:20px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:12px 0}
.hero{background:linear-gradient(135deg,#6b1a82,#1c1026 70%);border-color:#e040fb55}
.btn,.btn2{border:0;padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:var(--ac)}
.btn2{background:var(--pn2);color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0}
.g{color:var(--g)}.r{color:var(--r)}.mu{color:var(--mu)}.ac{color:var(--ac)}a.ac{cursor:pointer;text-decoration:underline}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:500}
tr[data-a]{cursor:pointer}tr[data-a]:hover{background:var(--pn2)}th[data-a]{cursor:pointer}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#ffffff14}.pill.g{background:#2ee59d22}.pill.r{background:#ff5c7a22}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.cols .card{margin:0}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);cursor:pointer;display:inline-block;margin:0 6px 6px 0}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30;padding:16px}.ov[hidden]{display:none}#md .card{max-width:460px;width:100%;margin:0}
#ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;opacity:0;transition:.2s;pointer-events:none}#ts.on{opacity:1}
#ch{height:340px;overflow:auto}.m{max-width:85%;padding:10px 12px;border-radius:12px;margin:6px 0;background:var(--pn2)}.m.u{margin-left:auto;background:var(--ac2);color:#fff}
canvas{width:100%;border-radius:10px;background:#0c0912;margin-top:10px}
.drop{display:block;border:2px dashed #e040fb77;border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--ac);font-weight:600;margin:0}
.big{font-size:40px;margin:0 0 14px;outline:0}.tag{color:var(--ac);font-size:12px;letter-spacing:.15em;font-weight:700}h1{margin:0 0 6px}h3{margin:20px 0 6px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;border-top:1px solid #ffffff22;margin-top:16px;padding-top:14px}
.k{font-size:22px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0}
@media(max-width:800px){#sb{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:.2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}#sb.open{transform:none}#mn{padding:14px}.big{font-size:32px}}
@media(min-width:801px){#bt{display:none}}
</style></head><body>
<aside id="sb"></aside>
<div id="wr"><div id="top"><button class="btn2" id="bt" data-a="side">☰</button><b id="tt">Dashboard</b><span id="st" class="mu" style="margin-left:auto;font-size:12px">● memuat…</span></div><main id="mn"></main></div>
<div class="ov" id="md" hidden data-a="x"><div class="card" id="mc"></div></div><div id="ts"></div>
<datalist id="sy"></datalist>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let S={name:'trader',wl:['BTC','ETH','SOL'],pf:[],tj:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('sa')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sa',JSON.stringify(S))}catch(e){}};
const F={sk:'sc',sd:-1,dir:'All',ty:'All',min:50,su:'All',sd2:'All',nc:'Stocks',rs:'NASDAQ:NVDA',mk:'america',pq:'',nm:'All'};
const CR=[['BTC','Bitcoin'],['ETH','Ethereum'],['BNB','BNB'],['SOL','Solana'],['XRP','XRP'],['DOGE','Dogecoin'],['ADA','Cardano'],['AVAX','Avalanche'],['TRX','TRON'],['LINK','Chainlink'],['DOT','Polkadot'],['LTC','Litecoin'],['NEAR','NEAR'],['SUI','Sui'],['APT','Aptos'],['ARB','Arbitrum']];
const M={},H={};
CR.forEach(([s,n])=>{H[s]=Array(40).fill(1);M[s]={s,n,p:1,o:1,c:1,rv:1,sc:50,rs:50,su:'-',qv:0}});
const SY=Object.keys(M);S.wl=S.wl.filter(x=>M[x]);S.pf=S.pf.filter(x=>M[x.s]);$('#sy').innerHTML=SY.map(s=>`<option value="${s}">`).join('');
const f=p=>p.toLocaleString('en-US',{minimumFractionDigits:p<.01?8:p<1?4:2,maximumFractionDigits:p<.01?8:p<1?4:2});
const ch=s=>(M[s].p/M[s].o-1)*100,dir=s=>M[s].p>=M[s].o?'Long':'Short';
const cc=s=>{const v=ch(s);return `<b class="${v>=0?'g':'r'}" data-c="${s}">${v>=0?'+':''}${v.toFixed(2)}%</b>`};
const pill=d=>`<span class="pill ${d=='Long'?'g':'r'}">${d}</span>`;
const sp=(s,w=90,h=26)=>{const a=H[s],mn=Math.min(...a),mx=Math.max(...a);return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${a[39]>=a[0]?'#2ee59d':'#ff5c7a'}" stroke-width="1.6" points="${a.map((v,i)=>(i*w/39).toFixed(1)+','+(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1)).join(' ')}"/></svg>`};
const lv=s=>{const p=M[s].p,L=dir(s)=='Long'?1:-1,r=p*.025;return{e:p,sl:p-L*r,t1:p+L*r*1.5,t2:p+L*r*3}};
const rows=l=>l.length?`<div class="tw"><table><tr><th>Symbol<th>Price<th>24H<th>Trend<th>Rel Vol<th>Score<th>Signal</tr>${l.map(s=>`<tr data-a="sym" data-v="${s}"><td><b>${s}</b> <span class="mu">${M[s].n}</span><td data-p="${s}">${f(M[s].p)}<td>${cc(s)}<td>${sp(s)}<td>${M[s].rv?M[s].rv+'x':'–'}<td><b class="ac">${M[s].sc||'–'}</b><td>${pill(dir(s))}`).join('')}</table></div>`:'<p class="mu">Tidak ada hasil.</p>';
const chips=(k,opts)=>opts.map(o=>`<span class="chip ${F[k]==o?'on':''}" data-a="pick" data-v="${k}|${o}">${o}</span>`).join('');
const toast=t=>{const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)};
const usd=v=>(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:2});
const pc=v=>`<b class="${v>=0?'g':'r'}">${usd(v)}</b>`;
const opts=`<datalist id="sy2"></datalist>`;
let cur='dashboard',LA=null,CH=[['m','Halo! Saya TradeGPT. Tanya apa saja, mis. "analisa NVDA", "berapa risiko per trade?", atau "setup terbaik hari ini".']];

function gpt(q){const l=q.toLowerCase(),s=SY.find(k=>new RegExp('\\b'+k+'\\b','i').test(q));
if(s){const m=M[s],v=lv(s);return `<b>${s}</b> (${m.n}) ${f(m.p)}, 24H ${ch(s).toFixed(2)}%. Bias ${dir(s)}, Setup Score ${m.sc}, RSI ${m.rs}, volume ${m.rv}x, pola ${m.su}. Entry ${f(v.e)}, SL ${f(v.sl)}, TP1 ${f(v.t1)}, TP2 ${f(v.t2)}. Simulasi edukatif, bukan saran keuangan.`}
if(/risk|risiko|lot|size|ukuran/.test(l))return 'Aturan umum: risiko 1% saldo per trade. Ukuran posisi = (saldo × risiko%) ÷ jarak entry ke stop. Hitung otomatis di <a class="ac" data-a="go" data-v="risk">Risk Calculator</a>.';
if(/rsi/.test(l))return 'RSI mengukur momentum 0–100. Di atas 70 = jenuh beli, di bawah 30 = jenuh jual. Paling berguna dikombinasikan dengan tren dan support/resistance.';
if(/macd/.test(l))return 'MACD = selisih EMA 12 dan 26. Persilangan dengan garis sinyal menandakan perubahan momentum.';
if(/stop loss|stoploss|\bsl\b/.test(l))return 'Taruh stop loss di balik level struktur (di bawah support untuk Long, di atas resistance untuk Short), bukan di angka acak. Pastikan R:R minimal 1:2.';
if(/terbaik|top|scan|cari|best/.test(l)){const t=SY.slice().sort((a,b)=>M[b].sc-M[a].sc).slice(0,3);return 'Skor tertinggi saat ini: '+t.map(x=>`<a class="ac" data-a="sym" data-v="${x}">${x}</a> (${M[x].sc}, ${dir(x)})`).join(', ')+'.'}
if(/watch|jurnal|journal|portfolio/.test(l))return `Watchlist kamu berisi ${S.wl.length} aset, jurnal ${S.tj.length} trade, portofolio ${S.pf.length} posisi.`;
return 'Coba: "analisa NVDA", "apa itu RSI?", "cara pasang stop loss", atau "setup terbaik hari ini".'}

const radar=ty=>{const q=(F.cq||'').toLowerCase(),ls=SY.filter(s=>(ty=='u'?M[s].rv>=1.2:1)&&(!q||(s+M[s].n).toLowerCase().includes(q)));const v=(s,k)=>k=='s'?s:k=='p'?M[s].p:k=='ch'?ch(s):M[s][k];
ls.sort((a,b)=>{const x=v(a,F.sk),y=v(b,F.sk);return(x>y?1:x<y?-1:0)*F.sd});
const hd=[['s','Symbol'],['p','Price'],['ch','24H'],['rv','Rel Vol'],['rs','RSI'],['sc','Score']];
return `<div class="tw"><table><tr>${hd.map(([k,n])=>`<th data-a="sort" data-v="${k}">${n}${F.sk==k?(F.sd>0?' ▲':' ▼'):''}`).join('')}<th>Trend<th>Signal</tr>${ls.slice(0,F.lim||100).map(s=>`<tr data-a="sym" data-v="${s}"><td><b>${s}</b> <span class="mu">${M[s].n}</span><td data-p="${s}">${f(M[s].p)}<td>${cc(s)}<td>${M[s].rv?M[s].rv+'x':'–'}<td>${M[s].rs||'–'}<td><b class="ac">${M[s].sc||'–'}</b><td>${sp(s,70,22)}<td>${pill(dir(s))}`).join('')}</table></div>${ls.length>(F.lim||100)?`<p><button class="btn2" data-a="more">Tampilkan lebih banyak (${ls.length-(F.lim||100)} lagi)</button></p>`:''}<p class="mu" style="font-size:12px">${ls.length} aset</p>`};
const best=(n,fn)=>SY.filter(fn||(()=>1)).sort((a,b)=>M[b].sc-M[a].sc).slice(0,n);
const NT=[['Stocks','{s} melonjak setelah laporan kuartalan lampaui ekspektasi','Analis menaikkan target harga dan volume perdagangan melonjak sejak pembukaan.'],['Crypto','{s} menembus resistance kunci, volume futures meningkat','Open interest naik seiring trader memburu momentum breakout.'],['Macro','Pasar menunggu data inflasi, {s} bergerak hati-hati','Investor menimbang peluang pemangkasan suku bunga berikutnya.'],['Stocks','{s} diturunkan peringkatnya oleh satu bank investasi','Alasan utama: valuasi tinggi dan perlambatan pertumbuhan.'],['Crypto','Arus masuk ETF mendorong {s} ke level tertinggi mingguan','Dana institusi terus menambah eksposur aset digital.'],['Macro','Dolar melemah, aset berisiko termasuk {s} menguat','Imbal hasil obligasi turun menjelang rilis data tenaga kerja.']];
const PO=[['Rep. A. Morgan','House','NVDA','Buy','$15K–$50K','2026-10-14'],['Sen. B. Hale','Senate','AAPL','Sell','$50K–$100K','2026-10-12'],['Rep. C. Reyes','House','MSFT','Buy','$1K–$15K','2026-10-10'],['Sen. D. Park','Senate','TSLA','Buy','$100K–$250K','2026-10-08'],['Rep. E. Novak','House','AMZN','Sell','$15K–$50K','2026-10-07'],['Rep. F. Lindqvist','House','AMD','Buy','$1K–$15K','2026-10-03'],['Sen. G. Okafor','Senate','META','Sell','$50K–$100K','2026-10-01'],['Rep. H. Tanaka','House','GOOGL','Buy','$15K–$50K','2026-09-28'],['Sen. I. Duarte','Senate','COIN','Buy','$1K–$15K','2026-09-25'],['Rep. J. Walsh','House','NFLX','Sell','$15K–$50K','2026-09-22']];

const PG={
dashboard:{t:'Dashboard',h:()=>{const h=new Date().getHours(),pv=S.pf.reduce((a,x)=>a+x.q*M[x.s].p,0),cl=S.tj.filter(x=>x.x!=null),w=cl.filter(x=>jp(x)>0).length,tp=cl.reduce((a,x)=>a+jp(x),0);
return `<div class="mu">Good ${h<12?'morning':h<18?'afternoon':'evening'},</div><h1 class="big" contenteditable="true" spellcheck="false" id="nm" title="Klik untuk ubah nama">${S.name}</h1>
<div id="t1" style="min-height:48px"></div><div class="card hero"><div class="tag">● MOST USED TOOL</div><h1>Chart Analysis</h1><p class="mu">Masukkan simbol aset — dapatkan arah, Setup Score, entry, stop loss dan target dari data nyata.</p><button class="btn" data-a="go" data-v="chart">✦ Analyze a symbol</button>
<div class="st"><div><b class="ac">01</b><br>⌕ <b>Pilih</b><br><span class="mu">Simbol aset</span></div><div><b class="ac">02</b><br>✦ <b>Analyze</b><br><span class="mu">Direction and Setup Score</span></div><div><b class="ac">03</b><br>◎ <b>Trade</b><br><span class="mu">Entry, stop and targets</span></div></div></div>
<div class="grid"><div class="card"><span class="mu">Watchlist</span><div class="k">${S.wl.length} aset</div></div><div class="card"><span class="mu">Portfolio</span><div class="k">${usd(pv)}</div></div><div class="card"><span class="mu">Win rate</span><div class="k">${cl.length?Math.round(w/cl.length*100)+'%':'–'}</div></div><div class="card"><span class="mu">Journal P&amp;L</span><div class="k">${pc(tp)}</div></div></div>
<h3>Top Setups</h3><div class="card">${rows(best(6))}</div>
<h3>Stocks Overview · TradingView</h3><div class="card" id="t2"></div><h3>Quick Tools</h3><div class="grid">${NV.flatMap(g=>g[1]).slice(0,12).map(n=>`<div class="card nv" data-a="go" data-v="${n[0]}" style="margin:0">${n[1]} ${n[2]}</div>`).join('')}</div>`}},
chart:{t:'Chart Analysis',h:()=>`<h1>Chart Analysis</h1><p class="mu">Upload screenshot chart (candle hijau/merah). Analisis berjalan di browser kamu; gambar tidak dikirim ke server.</p>
<div class="cols"><div class="card"><label class="drop" for="fl">⬆ Upload a chart<br><span class="mu">klik untuk memilih gambar</span></label><input id="fl" type="file" accept="image/*" hidden><canvas id="cv" width="640" height="360"></canvas><div class="row"><button class="btn2" data-a="demo">Chart contoh</button></div></div>
<div class="card"><label>Aset<input id="as" value="BTC" list="sy"></label><label>Harga saat ini (kosong = harga pasar)<input id="pr" type="number" step="any"></label><label>Timeframe<select id="tf"><option>5m<option>15m<option>1H<option selected>4H<option>1D<option>1W</select></label><div class="row"><button class="btn" data-a="an">✦ Analyze</button></div><div id="ar" class="mu" style="margin-top:12px">Hasil analisis muncul di sini.</div></div></div>`,i:()=>{demo();$('#fl').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=$('#cv'),x=c.getContext('2d'),k=Math.min(c.width/im.width,c.height/im.height);x.fillStyle='#0c0912';x.fillRect(0,0,c.width,c.height);x.drawImage(im,(c.width-im.width*k)/2,(c.height-im.height*k)/2,im.width*k,im.height*k);toast('Gambar dimuat, klik Analyze')};im.src=rd.result};rd.readAsDataURL(fl)}}},
scanner:{t:'AI Scanner',h:()=>`<h1>AI Scanner</h1><p class="mu">Pindai seluruh pasar dan urutkan berdasarkan Setup Score.</p><div class="card">${chips('dir',['All','Long','Short'])}<label>Min score: <b id="mv">${F.min}</b><input type="range" min="40" max="95" value="${F.min}" data-f="min"></label><button class="btn2" data-a="shuf">↻ Scan ulang</button></div><div class="card" id="out">${PG.scanner.o()}</div>`,o:()=>{const l=SY.filter(s=>(F.ty=='All'||(F.ty=='Crypto')==M[s].c)&&(F.dir=='All'||dir(s)==F.dir)&&M[s].sc>=F.min).sort((a,b)=>M[b].sc-M[a].sc);return `<p class="mu">${l.length} hasil</p>`+rows(l)}},
setup:{t:'Setup Scanner',h:()=>`<h1>Setup Scanner</h1><p class="mu">Temukan pola setup siap trade.</p>${chips('su',['All','Breakout','Pullback','Reversal','Trend Continuation'])}<div class="grid" id="out">${PG.setup.o()}</div>`,o:()=>{const l=SY.filter(s=>F.su=='All'||M[s].su==F.su);return l.map(s=>{const v=lv(s);return `<div class="card" style="margin:0"><div><b>${s}</b> ${pill(dir(s))} <span class="mu">${M[s].su}</span></div><p class="mu" style="margin:6px 0">Score <b class="ac">${M[s].sc||'–'}</b> · R:R 1:3</p>Entry ${f(v.e)}<br>SL <span class="r">${f(v.sl)}</span><br>TP <span class="g">${f(v.t2)}</span><div class="row"><button class="btn2" data-a="sym" data-v="${s}">Detail</button><button class="btn2" data-a="rcs" data-v="${s}">Risk</button></div></div>`}).join('')||'<p class="mu">Tidak ada setup.</p>'}},
gpt:{t:'TradeGPT',h:()=>`<h1>TradeGPT</h1><p class="mu">Asisten trading berbasis aturan (berjalan di browser).</p><div class="card"><div id="ch">${CH.map(m=>`<div class="m ${m[0]}">${m[1]}</div>`).join('')}</div><div>${['Analisa NVDA','Setup terbaik hari ini','Apa itu RSI?','Cara pasang stop loss'].map(q=>`<span class="chip" data-a="ask" data-v="${q}">${q}</span>`).join('')}</div><div class="row"><input id="gi" placeholder="Tanya TradeGPT..."><button class="btn" style="flex:0" data-a="send">Kirim</button></div></div>`,i:()=>{const c=$('#ch');c.scrollTop=c.scrollHeight;$('#gi').onkeydown=e=>{if(e.key=='Enter')acts.send()}}},
ideas:{t:'Trade Ideas',h:()=>`<h1>Trade Ideas</h1><div class="grid">${best(6).map(s=>{const m=M[s],v=lv(s);return `<div class="card" style="margin:0"><div><b>${s}</b> ${pill(dir(s))} <span class="ac">${m.sc}</span></div><p class="mu">${m.n}: pola ${m.su} dengan RSI ${m.rs} dan volume ${m.rv}x rata-rata. ${dir(s)=='Long'?'Momentum mendukung kenaikan selama harga bertahan di atas':'Tekanan jual dominan selama harga berada di bawah'} ${f(v.sl)}.</p>Entry ${f(v.e)} · TP ${f(v.t2)}<div class="row"><button class="btn2" data-a="wl" data-v="${s}">${S.wl.includes(s)?'★ Ada':'☆ Watch'}</button><button class="btn2" data-a="jr" data-v="${s}">Jurnal</button></div></div>`}).join('')}</div>`},

d.forEach((q,i)=>{const X=i*bw+bw/2;x.strokeStyle=x.fillStyle=q.c>=q.o?'#2ee59d':'#ff5c7a';x.beginPath();x.moveTo(X,y(q.h));x.lineTo(X,y(q.l));x.stroke();x.fillRect(X-bw*.35,Math.min(y(q.o),y(q.c)),bw*.7,Math.max(1,Math.abs(y(q.o)-y(q.c))))});

lv.forEach(([v,col,t])=>{if(!(v>=mn&&v<=mx))return;x.strokeStyle=col;x.setLineDash([5,4]);x.beginPath();x.moveTo(0,y(v));x.lineTo(W,y(v));x.stroke();x.setLineDash([]);x.fillStyle=col;x.font='11px sans-serif';x.fillText(t+' '+f(v),4,y(v)-3)})}
async function analyzeSym(){const raw=$('#as').value.trim().toUpperCase(),tf=$('#tf').value,o=$('#ar'),cv=$('#cv');if(!raw)return toast('Isi simbol dulu');
if(raw.includes(':')){cv.style.display='none';LA=null;tv('ar','technical-analysis',{symbol:raw,height:450,interval:({'15m':'15m','1H':'1h','4H':'4h','1D':'1D'})[tf]});return}
cv.style.display='block';o.innerHTML='Mengambil data Binance…';const s=raw.replace(/USDT$/,'').replace(/[^A-Z0-9]/g,'');let k;
try{k=(await bf('klines?symbol='+s+'USDT&interval='+({'15m':'15m','1H':'1h','4H':'4h','1D':'1d'})[tf]+'&limit=200')).map(q=>({o:+q[1],h:+q[2],l:+q[3],c:+q[4],v:+q[5]}))}catch(e){o.innerHTML='<span class="r">Simbol tidak ditemukan di Binance, atau koneksi gagal.</span> Untuk saham/forex tulis BURSA:KODE, mis. NASDAQ:AAPL.';return}
const c=k.map(q=>q.c),n=c.length,e20=ema(c,20),e50=ema(c,50),e12=ema(c,12),e26=ema(c,26),ml=e12.map((v,i)=>v-e26[i]),sg=ema(ml,9),hist=ml[n-1]-sg[n-1];
let g=0,l=0;for(let i=1;i<=14;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=14;l/=14;for(let i=15;i<n;i++){const d=c[i]-c[i-1];g=(g*13+Math.max(d,0))/14;l=(l*13+Math.max(-d,0))/14}const rs=l?100-100/(1+g/l):100;
let at=0;for(let i=n-14;i<n;i++)at+=Math.max(k[i].h-k[i].l,Math.abs(k[i].h-c[i-1]),Math.abs(k[i].l-c[i-1]));at/=14;
const p=c[n-1],vs=(p>e50[n-1])+(e20[n-1]>e50[n-1])+(hist>0)+(rs>50),L=vs>2?1:vs<2?-1:(p>e50[n-1]?1:-1),rv=k[n-2].v/(k.slice(-42,-2).reduce((a,q)=>a+q.v,0)/40);
const hs=[],ls=[];for(let i=2;i<n-2;i++){const q=k[i];if(q.h>=Math.max(k[i-1].h,k[i-2].h,k[i+1].h,k[i+2].h))hs.push(q.h);if(q.l<=Math.min(k[i-1].l,k[i-2].l,k[i+1].l,k[i+2].l))ls.push(q.l)}
const res=Math.min(...hs.filter(v=>v>p),Infinity),sup=Math.max(...ls.filter(v=>v<p),-Infinity),al=L>0?vs:4-vs;
let sc=40+al*9+(L>0?(rs>=45&&rs<=68?8:rs>75?-8:0):(rs<=55&&rs>=32?8:rs<25?-8:0))+Math.min(8,Math.max(0,(rv-1)*8))+((L>0?hist>0:hist<0)?4:0);sc=Math.round(Math.max(35,Math.min(95,sc)));
const R=1.5*at,sl=p-L*R,t1=p+L*R*1.5,t2=p+L*R*2.5,t3=p+L*R*4;LA={as:s,L,sc,e:p,sl,t1,t2,t3};
drawC(k,e20,e50,[[p,'#e040fb','Entry'],[sl,'#ff5c7a','SL'],[t1,'#2ee59d','TP1'],[sup,'#38bdf8','Sup'],[res,'#fbbf24','Res']]);
